name: Selenium Cucumber TestNG UI Tests

on:
  workflow_dispatch:

  schedule:
    # 10:00 AM CST / 11:00 AM CDT
    - cron: '0 16 * * *'

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set Up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          echo "Chrome path: $(which chrome || which google-chrome || true)"
          chrome --version || google-chrome --version || true

      - name: Run Smoke Tests
        run: |
          mvn clean test \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Denv=stag \
            -Dcucumber.filter.tags="@Smoke"

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore