name: Selenium Cucumber TestNG UI Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

  schedule:
    # Daily at 10:00 AM CST (16:00 UTC)
    - cron: '0 16 * * *'

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set Up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Chrome Version
        run: |
          google-chrome --version

      - name: Run Smoke Tests
        run: |
          mvn clean test \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Denv=stag \
            -Dcucumber.filter.tags="@Smoke"

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload TestNG Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output/
          if-no-files-found: ignore

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore